<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mebel Segment — мебельная фурнитура оптом</title>
<meta name="description" content="Mebel Segment, Ставрополь: петли с доводчиком clip-on, 3D-петли, шариковые направляющие и направляющие скрытого монтажа. Опт коробками и розница, счёт для юрлиц и ИП.">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Светлая подложка, тёмные скруглённые панели, крупный жирный заголовок капслоком, чёрные кнопки-таблетки. */
:root{
  color-scheme:light;
  --bg:#E8E7E3; --surface:#FFFFFF; --ink:#151515; --muted:#6C6B67; --line:#D8D6D0; --chip:#F2F1ED;
  --panel:#1B1B1B; --panel-2:#262626; --panel-ink:#EDECE8; --panel-muted:#A3A29C;
  --accent:#D46E3B; --on-accent:#FFFFFF;
  --ok:#2E7D4F; --warn:#B26A00; --bad:#C0352B;
  --r-xl:28px; --r-lg:20px; --r-md:14px; --r-pill:999px;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
img{max-width:100%}
[hidden]{display:none!important}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
.caps{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:-.01em;line-height:.95}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.02em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);
  padding:10px 20px;border-radius:var(--r-pill);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{background:#000}
.btn.light{background:var(--panel-ink);color:var(--ink);border-color:var(--panel-ink)}
.btn.ghost-light{border-color:var(--panel-muted);color:var(--panel-ink)}
.btn.small{padding:6px 12px;font-size:11px}
.btn.block{width:100%;padding-block:15px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tag{display:inline-block;padding:6px 14px;border-radius:var(--r-pill);border:1px solid currentColor;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}

/* шапка */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-block:12px}
.bar-in{display:flex;align-items:center;gap:18px;background:var(--surface);border-radius:var(--r-pill);padding:8px 8px 8px 16px;box-shadow:0 1px 0 rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto}
.brand img{height:34px;width:auto}
.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--ink);color:var(--bg);font-family:var(--f-display);font-weight:900;font-size:14px;letter-spacing:-.04em}
.mark i{font-style:normal;color:var(--accent)}
.brand-txt{font-family:var(--f-display);font-weight:800;font-size:12px;line-height:1.05;letter-spacing:.02em;text-transform:uppercase}
.nav{display:flex;gap:22px;font-size:13px;font-weight:600}
.nav a{text-decoration:none;color:var(--muted)}
.nav a:hover{color:var(--ink)}
.phone{font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
.cart-btn .count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:11px;letter-spacing:0}
.modes{display:flex;background:var(--chip);border-radius:var(--r-pill);padding:3px}
.modes button{border:0;background:none;padding:6px 12px;border-radius:var(--r-pill);font-weight:700;font-size:12px;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:980px){.nav,.phone{display:none}}
@media (max-width:520px){.brand-txt{display:none}.bar-in{gap:8px}}

/* герой */
.hero{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;padding-top:6px}
.hero-main{position:relative;overflow:hidden;background:var(--panel);color:var(--panel-ink);border-radius:var(--r-xl);padding:clamp(22px,4vw,44px);display:grid;gap:20px;align-content:start;min-height:440px}
.hero-main .tag{color:var(--panel-muted);justify-self:start}
.hero-main h1{font-size:clamp(28px,4.3vw,58px);font-weight:600;letter-spacing:0;line-height:1.02;color:var(--panel-ink);position:relative;z-index:1}
.hero-main p{margin:0;max-width:40ch;color:var(--panel-muted);position:relative;z-index:1}
.hero-main .btn{justify-self:start;position:relative;z-index:1}
.hero-photo{position:absolute;right:0;bottom:0;height:100%;width:auto;max-width:58%;object-fit:cover;object-position:center;pointer-events:none;
  -webkit-mask-image:radial-gradient(ellipse 70% 65% at 62% 55%,#000 45%,transparent 78%);mask-image:radial-gradient(ellipse 70% 65% at 62% 55%,#000 45%,transparent 78%)}
.hero-main::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(90deg,rgba(27,27,27,.95) 0%,rgba(27,27,27,.82) 42%,rgba(27,27,27,0) 68%)}
@media (min-width:861px) and (max-width:1120px){.hero-photo{height:78%;max-width:52%}}
.hero-main .tag{position:relative;z-index:1}
@media (max-width:860px){.hero-main::after{background:linear-gradient(180deg,rgba(27,27,27,.9) 0%,rgba(27,27,27,.6) 55%,rgba(27,27,27,0) 75%)}}
body.reveal .hero-photo{animation:photoIn 2s .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes photoIn{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
.hero-side{display:grid;gap:14px}
.side-card{border-radius:var(--r-xl);padding:24px;display:grid;gap:10px;align-content:space-between;text-decoration:none;min-height:200px}
.side-card h2{font-size:clamp(24px,2.6vw,34px)}
.side-card p{margin:0;font-size:14px}
.side-card.light{background:var(--surface)}
.side-card.light p{color:var(--muted)}
.side-card.dark{background:var(--panel);color:var(--panel-ink)}
.side-card.dark p{color:var(--panel-muted)}
.side-card .go{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
@media (max-width:860px){.hero{grid-template-columns:1fr}.hero-main{min-height:0;padding-bottom:min(62vw,300px)}
  .hero-photo{height:min(70vw,340px);max-width:none;width:auto;right:-4%;-webkit-mask-image:radial-gradient(ellipse 60% 60% at 55% 60%,#000 40%,transparent 75%);mask-image:radial-gradient(ellipse 60% 60% at 55% 60%,#000 40%,transparent 75%)}
  .hero-side{grid-template-columns:1fr 1fr}.side-card{min-height:0}}
@media (max-width:520px){.hero-side{grid-template-columns:1fr}}

.search{display:flex;gap:8px;align-items:center;background:var(--surface);border-radius:var(--r-pill);padding:6px 6px 6px 20px;margin-top:14px}
.search input{flex:1;min-width:0;border:0;background:none;padding:8px 0;font-size:15px;outline:none}

/* бегущая строка */
.ticker{overflow:hidden;margin-top:18px;border-block:1.5px solid var(--ink);padding-block:10px;white-space:nowrap}
.ticker-in{display:inline-flex;gap:28px;animation:run 40s linear infinite;font-family:var(--f-display);font-weight:800;font-size:clamp(16px,2vw,22px);text-transform:uppercase}
.ticker-in span{display:inline-flex;gap:28px;align-items:center}
.ticker-in span::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
@keyframes run{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker-in{animation:none}html{scroll-behavior:auto}}
/* приветственная заставка */
.intro{position:fixed;inset:0;z-index:50;background:rgba(27,27,27,1);color:var(--panel-ink);display:grid;place-items:center;overflow:hidden;cursor:pointer;
  transition:background-color 1.8s cubic-bezier(.4,0,.2,1)}
.intro.out{background:rgba(27,27,27,0);pointer-events:none}
.intro.out .intro-line,.intro.out .intro-txt,.intro.out .intro-skip,.intro.out .intro-glow{transition:opacity .6s ease;opacity:0!important;animation-play-state:paused}
.intro-mark{position:relative;width:min(340px,72vw);transform-origin:0 0;will-change:transform}
.intro.out .intro-mark{transition:transform 1.6s cubic-bezier(.65,0,.25,1)}
.intro-logo-dark{position:absolute;inset:0;width:100%;height:auto;opacity:0}
.intro.out .intro-logo-dark{opacity:1;transition:opacity .8s .8s ease}
.intro.out .intro-logo{opacity:0!important;transition:opacity .8s .8s ease}
body.intro-on .brand{opacity:0}
body.intro-on .bar-in{opacity:0}
body.reveal .bar-in{animation:softIn 1.4s .3s ease both}
body.reveal main{animation:pageIn 1.8s cubic-bezier(.4,0,.2,1) both}
@keyframes softIn{from{opacity:0}to{opacity:1}}
@keyframes pageIn{from{opacity:0;filter:blur(8px);transform:scale(.985)}to{opacity:1;filter:none;transform:none}}
.intro-in{display:grid;justify-items:center;gap:22px;padding:24px;text-align:center}
.intro-logo{width:100%;height:auto;display:block;opacity:0;transform:scale(.86);filter:blur(14px);animation:introLogo 1.4s .25s cubic-bezier(.2,.7,.2,1) forwards}
.intro-line{height:3px;width:min(340px,72vw);background:var(--accent);transform:scaleX(0);transform-origin:left;animation:introLine 1s 1.2s cubic-bezier(.7,0,.2,1) forwards}
.intro-txt{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.14em;font-size:clamp(11px,1.6vw,14px);color:var(--panel-muted)}
.intro-txt span{display:inline-block;opacity:0;transform:translateY(12px);animation:introWord .7s cubic-bezier(.2,.7,.2,1) forwards}
.intro-skip{position:absolute;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));border:1.5px solid var(--panel-muted);background:none;color:var(--panel-ink);
  padding:8px 16px;border-radius:var(--r-pill);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:0;animation:introWord .6s 1.6s forwards}
.intro-glow{position:absolute;width:60vmax;height:60vmax;border-radius:50%;background:radial-gradient(circle,rgba(212,110,59,.22),transparent 60%);opacity:0;animation:introGlow 3s .2s ease-out forwards;pointer-events:none}
@keyframes introLogo{to{opacity:1;transform:none;filter:none}}
@keyframes introLine{to{transform:scaleX(1)}}
@keyframes introWord{to{opacity:1;transform:none}}
@keyframes introGlow{40%{opacity:1}to{opacity:.55}}
/* построчное появление заголовка после заставки */
.hero-main h1 .ln{display:block;overflow:hidden}
.hero-main h1 .ln>span{display:block}
body.reveal .hero-main h1 .ln>span{transform:translateY(105%);opacity:0;animation:lineUp 1.3s .9s cubic-bezier(.2,.7,.2,1) forwards}
body.reveal .hero-main h1 .ln:nth-child(2)>span{animation-delay:1.05s}
body.reveal .hero-main h1 .ln:nth-child(3)>span{animation-delay:1.2s}
body.reveal .hero-main h1 .ln:nth-child(4)>span{animation-delay:.36s}
body.reveal .hero-side .side-card{opacity:0;transform:translateY(24px);animation:introWord 1.2s 1.1s cubic-bezier(.2,.7,.2,1) forwards}
body.reveal .hero-side .side-card+.side-card{animation-delay:1.3s}
@keyframes lineUp{to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.intro{display:none}body.reveal *{animation:none!important;transform:none!important;opacity:1!important}}


/* разделы */
.section{padding-block:clamp(40px,6vw,72px) 0}
.sec-head{display:flex;gap:16px;align-items:end;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
.sec-head h2{font-size:clamp(30px,4.6vw,56px)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--ink);background:transparent;padding:7px 16px;border-radius:var(--r-pill);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.card{background:var(--surface);border-radius:var(--r-lg);padding:10px 10px 16px;display:flex;flex-direction:column;gap:8px}
.pic{background:var(--panel);border-radius:var(--r-md);aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;color:var(--panel-ink);position:relative}
.pic svg{width:66%;height:auto}
.pic svg *{fill:none;stroke:currentColor;stroke-width:2.5;stroke-linejoin:round}
.pic .stock{position:absolute;left:10px;top:10px}
.card-body{display:flex;flex-direction:column;gap:6px;padding-inline:6px;flex:1}
.card h3{font-size:15px;font-weight:700;line-height:1.3}
.descr{margin:0;font-size:13px;color:var(--muted);line-height:1.4}
.price-row{padding-top:6px}
.price-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:auto}
.price{font-family:var(--f-display);font-weight:800;font-size:20px}
.stock{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--r-pill);font-size:11px;font-weight:700;background:var(--surface);color:var(--ink)}
.stock::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sc)}
.s-ok{--sc:var(--ok)}.s-low{--sc:var(--warn)}.s-out{--sc:var(--muted)}
.card .btn{margin-top:4px}

.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.step{background:var(--surface);border-radius:var(--r-lg);padding:24px;display:grid;gap:10px;align-content:start}
.step b{font-family:var(--f-display);font-weight:900;font-size:40px;color:var(--accent);line-height:1}
.step h3{font-size:18px;font-weight:800}
.step p{margin:0;color:var(--muted)}
.guide{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.guide>div{background:var(--surface);border-radius:var(--r-lg);padding:20px;display:grid;gap:6px;align-content:start}
.guide h3{font-size:16px;font-weight:800}
.guide p{margin:0;font-size:14px;color:var(--muted)}
.opt{background:var(--panel);color:var(--panel-ink);border-radius:var(--r-xl);padding:clamp(24px,4vw,44px);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px}
.opt h2{font-size:clamp(30px,4.6vw,56px)}
.opt p{color:var(--panel-muted);margin:0}
.opt ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.opt li{padding:14px 18px;border-radius:var(--r-md);background:var(--panel-2)}
.opt li b{display:block}
.opt li span{color:var(--panel-muted);font-size:14px}
.opt .acts{display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:860px){.steps{grid-template-columns:1fr}.opt{grid-template-columns:1fr}}

.foot{margin-top:clamp(40px,6vw,72px);background:var(--panel);color:var(--panel-ink);padding-block:36px calc(28px + env(safe-area-inset-bottom,0px))}
.foot-in{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px}
.foot h2{font-size:28px}
.foot .lbl{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--panel-muted)}
.foot a{text-decoration:none}
.foot .big{font-size:20px;font-weight:800}
.foot .small{font-size:13px;color:var(--panel-muted)}

/* корзина, окна */
.veil{position:fixed;inset:0;background:rgba(20,20,20,.5);backdrop-filter:blur(2px);z-index:20}
.drawer{position:fixed;top:12px;right:12px;bottom:12px;width:min(440px,calc(100% - 24px));background:var(--surface);border-radius:var(--r-xl);z-index:21;display:flex;flex-direction:column;overflow:hidden}
.d-head{display:flex;justify-content:space-between;align-items:center;padding:22px 22px 12px}
.d-head h2{font-size:22px}
.d-body{flex:1;overflow-y:auto;padding:0 22px}
.d-foot{border-top:1px solid var(--line);padding:16px 22px 22px;display:grid;gap:10px}
.x{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink);background:none;font-size:18px;line-height:1;display:grid;place-items:center}
.cline{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:4px 12px;padding-block:14px;border-bottom:1px solid var(--line);align-items:start}
.thumb{grid-row:span 3;width:64px;height:64px;border-radius:12px;background:var(--panel);color:var(--panel-ink);display:grid;place-items:center}
.thumb svg{width:80%}
.thumb svg *{fill:none;stroke:currentColor;stroke-width:3.5}
.cline .nm{font-weight:700;font-size:14px;line-height:1.3}
.cline .sum{font-weight:800;text-align:right}
.cline .sub{grid-column:3;text-align:right;font-size:12px;color:var(--muted)}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--ink);border-radius:var(--r-pill);height:32px;justify-self:start}
.qty button{width:32px;height:100%;border:0;background:none;font-size:16px;font-weight:700}
.qty input{width:48px;border:0;text-align:center;font-weight:700;background:none;-moz-appearance:textfield;padding:0}
.qty input::-webkit-inner-spin-button{-webkit-appearance:none}
.rm{border:0;background:none;padding:0;font-size:12px;color:var(--muted);text-decoration:underline;justify-self:start}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.total b{font-family:var(--f-display);font-weight:800;font-size:28px}
.hint{font-size:12px;color:var(--muted);margin:0}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
.modal{position:fixed;z-index:21;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:var(--surface);border-radius:var(--r-xl);padding:24px;display:grid;gap:14px}
.modal.wide{width:min(820px,calc(100% - 24px))}
.m-head{display:flex;justify-content:space-between;align-items:start;gap:12px}
.m-head h2{font-size:24px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1.5px solid var(--ink);border-radius:var(--r-pill);padding:3px}
.seg button{border:0;background:none;padding:9px 10px;border-radius:var(--r-pill);font-size:12px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
form.stack{display:grid;gap:12px}
label{display:grid;gap:5px;font-size:12px;font-weight:700;color:var(--muted)}
input[type=text],input[type=tel],input[type=number],input[type=password],select,textarea{width:100%;min-width:0;padding:11px 14px;border:1.5px solid var(--line);border-radius:var(--r-md);background:var(--surface);color:var(--ink);font-size:15px;font-weight:500}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none}
textarea{resize:vertical}
.err{color:var(--bad);font-size:13px;font-weight:600;margin:0}
.done{background:var(--chip);border-radius:var(--r-lg);padding:18px;display:grid;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:var(--r-pill);border:2px solid var(--accent);z-index:30;font-size:13px;font-weight:700;max-width:calc(100% - 32px)}

/* личный кабинет клиента */
.acc-btn{gap:6px}
.acc-btn.on{background:var(--chip);border-color:var(--chip)}
.acc-wrap{padding-block:36px 60px}
.acc-card{max-width:440px;margin:24px auto;background:var(--surface);border-radius:var(--r-xl);padding:28px;display:grid;gap:14px}
.acc-card h2{font-size:26px}
.acc-wrap.wide{display:grid;gap:18px}
.acc-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.acc-sub{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:18px;margin-top:10px}
.ord{background:var(--surface);border-radius:var(--r-lg);padding:18px 20px;display:grid;gap:12px}
.ord.empty{color:var(--muted)}
.ord-top,.ord-bot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ord-items{list-style:none;margin:0;padding:0;display:grid;gap:6px;border-block:1px solid var(--line);padding-block:10px}
.ord-items li{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.ord-items li>span:first-child{min-width:0}
.ord-sum{font-family:var(--f-display);font-weight:800;font-size:20px}
@media (max-width:640px){.acc-btn span{display:none}.ord-items li{flex-direction:column;gap:0}}
/* кабинет */
.gate{max-width:380px;margin:60px auto;background:var(--surface);border-radius:var(--r-xl);padding:26px;display:grid;gap:12px}
.gate h2{font-size:22px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:8px 4px}
.tabs button{border:1.5px solid transparent;background:none;padding:8px 14px;border-radius:var(--r-pill);font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.panel{padding-block:18px 56px;display:grid;gap:16px}
.panel-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.panel-head h2{font-family:var(--f-display);font-weight:800;font-size:24px;text-transform:uppercase}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{background:var(--surface);border-radius:var(--r-lg);padding:16px 18px;display:grid;gap:2px}
.tile b{font-family:var(--f-display);font-weight:800;font-size:24px}
.tile.lead{background:var(--panel);color:var(--panel-ink)}
.tile.lead .muted{color:var(--panel-muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.box{background:var(--surface);border-radius:var(--r-lg);padding:18px;display:grid;gap:8px;align-content:start;min-width:0}
.box h3{font-size:15px;font-weight:800}
.list-row{display:flex;justify-content:space-between;gap:10px;padding-block:7px;border-top:1px solid var(--line);font-size:14px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border-radius:var(--r-lg)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.pill{display:inline-block;padding:3px 10px;border-radius:var(--r-pill);font-size:11px;font-weight:800;white-space:nowrap;border:1.5px solid currentColor}
.p-ok{color:var(--ok)}.p-warn{color:var(--warn)}.p-bad{color:var(--bad)}.p-mute{color:var(--muted)}
.plus{color:var(--ok)}.minus{color:var(--bad)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.formbox{background:var(--surface);border-radius:var(--r-lg);padding:18px;display:grid;gap:12px;align-content:start}
.formbox h3{font-size:16px;font-weight:800}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.line{display:grid;grid-template-columns:minmax(0,1fr) 90px 120px 40px;gap:8px;align-items:center}
.line.no-cost{grid-template-columns:minmax(0,1fr) 90px 40px}
.inline-form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 150px auto;gap:8px;align-items:end}
.note{font-size:13px;color:var(--muted);background:var(--chip);border-radius:var(--r-md);padding:12px 14px;margin:0}
.doc{border:1.5px solid var(--line);border-radius:var(--r-md);padding:20px;display:grid;gap:10px;font-size:13px}
.doc h2{font-family:var(--f-body);font-weight:800;font-size:17px}
.doc .tbl-wrap{border:1px solid var(--line);border-radius:8px}
.req{display:grid;grid-template-columns:110px 1fr;gap:2px 10px}
.mark{display:flex;align-items:center;justify-content:center}
.pic{aspect-ratio:1/1;overflow:hidden}
.thumb{overflow:hidden}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pic .stock{z-index:1}
.pic:has(img){background:var(--chip)}
.thumb:has(img){background:var(--chip)}
.tthumb{width:44px;height:44px;border-radius:10px;background:var(--panel);color:var(--panel-ink);display:grid;place-items:center;overflow:hidden}
.tthumb img{width:100%;height:100%;object-fit:cover}
.tthumb svg{width:80%}.tthumb svg *{fill:none;stroke:currentColor;stroke-width:4}
.search input[type=text]{border:0;padding:8px 0;border-radius:0}
.qty input[type=number]{width:48px;border:0;padding:0;border-radius:0;text-align:center;font-weight:700}
@media (max-width:560px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card{padding:6px 6px 12px;border-radius:16px}
  .card h3{font-size:13px}
  .descr{display:none}
  .price{font-size:16px}
  .price-row{flex-direction:column;align-items:flex-start;gap:0}
  .card .btn{padding:10px 8px;font-size:10px}
  .pic .stock{left:6px;top:6px;font-size:10px;padding:3px 8px}
  .hero-main h1{font-size:clamp(18px,5.6vw,40px)}
  .hero-main>*{min-width:0}
}
@media (max-width:640px){.line{grid-template-columns:1fr 70px 40px}.line .cost{grid-column:1/3}.inline-form{grid-template-columns:1fr 1fr}}
</style>
<style media="print">
body *{visibility:hidden}.modal,.modal *{visibility:visible}.modal{position:absolute;inset:0;transform:none;width:100%;max-height:none;padding:0;border-radius:0}
.modal .x,.modal .acts,.modal .note{display:none}.veil{display:none}
</style>
</head>
<body>
<div class="intro" id="intro" role="dialog" aria-label="Добро пожаловать в Mebel Segment" hidden>
  <div class="intro-glow"></div>
  <div class="intro-in">
    <div class="intro-mark" id="introMark"><img class="intro-logo" src="/logo-light.png" alt="Mebel Segment"><img class="intro-logo-dark" src="/logo.png" alt=""></div>
    <div class="intro-line"></div>
    <div class="intro-txt"><span style="animation-delay:1.50s">Мебельная</span> <span style="animation-delay:1.62s">фурнитура</span> <span style="animation-delay:1.74s">·</span> <span style="animation-delay:1.86s">Ставрополь</span></div>
  </div>
  <button class="intro-skip" type="button">Войти на сайт →</button>
</div>
<header class="bar"><div class="wrap"><div class="bar-in">
  <a class="brand" href="#top" aria-label="Мебель Сегмент, на главную">
    <img id="logo" src="/logo.png" alt="Mebel Segment" hidden onload="this.hidden=false;this.parentNode.querySelectorAll('.mark,.brand-txt').forEach(e=>e.hidden=true)">
    <span class="mark" aria-hidden="true">M<i>S</i></span>
    <span class="brand-txt">Mebel<br>Segment</span>
  </a>
  <nav class="nav" id="nav" aria-label="Разделы">
    <a href="#catalog">Каталог</a><a href="#how">Как работаем</a><a href="#guide">Как выбрать</a><a href="#opt">Оптовикам</a><a href="#contacts">Контакты</a>
  </nav>
  <a class="phone num" id="phoneTop" hidden></a>
  <div class="modes" id="modes" role="group" aria-label="Раздел" hidden>
    <button id="m-shop" data-act="mode" data-v="">Магазин</button>
    <button id="m-admin" data-act="mode" data-v="admin">Кабинет</button>
  </div>
  <a id="accBtn" class="btn acc-btn" href="#account"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" fill="none" stroke="currentColor" stroke-width="2"/></svg><span id="accTxt">Войти</span></a>
  <button id="cartBtn" class="btn primary cart-btn" data-act="cart">Корзина <span class="count num" id="cartCount">0</span></button>
</div></div></header>
<main id="app"><div class="wrap empty">Загрузка…</div></main>
<footer class="foot" id="contacts"></footer>
<div id="layer"></div>
<input type="file" id="photoInput" accept="image/*" hidden>

<script>
'use strict';
const ICONS={
 'Петли':'<svg viewBox="0 0 120 80"><circle cx="38" cy="40" r="18"/><circle cx="38" cy="40" r="9"/><rect x="54" y="33" width="52" height="14" rx="4"/><circle cx="94" cy="40" r="3"/></svg>',
 'Направляющие':'<svg viewBox="0 0 120 80"><rect x="10" y="24" width="100" height="12" rx="2"/><rect x="24" y="44" width="86" height="12" rx="2"/><circle cx="40" cy="40" r="3"/><circle cx="60" cy="40" r="3"/><circle cx="80" cy="40" r="3"/></svg>',
 'Ручки':'<svg viewBox="0 0 120 80"><path d="M22 56V40Q22 26 36 26H84Q98 26 98 40V56"/><rect x="14" y="54" width="16" height="7" rx="2"/><rect x="90" y="54" width="16" height="7" rx="2"/></svg>',
 'Подъёмники':'<svg viewBox="0 0 120 80"><rect x="12" y="32" width="58" height="16" rx="8"/><rect x="70" y="37" width="38" height="6" rx="3"/><circle cx="12" cy="40" r="4"/><circle cx="108" cy="40" r="4"/></svg>',
 'Опоры':'<svg viewBox="0 0 120 80"><rect x="44" y="12" width="32" height="10" rx="2"/><rect x="54" y="22" width="12" height="34"/><path d="M34 66Q60 50 86 66Z"/></svg>',
 'Упаковка':'<svg viewBox="0 0 120 80"><ellipse cx="40" cy="40" rx="14" ry="24"/><ellipse cx="40" cy="40" rx="5" ry="9"/><path d="M40 16H96M40 64H96M96 16Q108 40 96 64"/></svg>',
 'Прочее':'<svg viewBox="0 0 120 80"><rect x="30" y="20" width="60" height="40" rx="4"/><path d="M30 34H90"/></svg>'
};
const HERO_ART='<img class="hero-photo" src="/hero-hinge.jpg" alt="Петля 3D с доводчиком Mebel Segment" loading="eager">';
const TICKER=['Доводчик — тихое закрывание','Clip-on без инструмента','Упаковка с крепежом','Опт коробками','3D-регулировка','Счёт для юрлиц и ИП','Также на Ozon'];
const LOW=10;
let C=null, A=null, U=undefined, accTab='login', cart={}, filt={cat:'',q:''}, tab='summary', ck={kind:'person',delivery:'pickup'}, lastOrder=null;
try{cart=JSON.parse(localStorage.getItem('cart'))||{}}catch(e){}
const saveCart=()=>{try{localStorage.setItem('cart',JSON.stringify(cart))}catch(e){}};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rub=n=>{n=Number(n);const f=Math.round(n*100)%100?2:0;return n.toLocaleString('ru-RU',{minimumFractionDigits:f,maximumFractionDigits:2})+'\u00a0₽'};
const dt=iso=>new Date(iso).toLocaleDateString('ru-RU');
const digits=s=>String(s||'').replace(/\D/g,'').replace(/^8(?=\d{10}$)/,'7');
function toast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
async function api(url,body){
  const r=await fetch(url,body===undefined?{credentials:'same-origin'}:{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  let data={};try{data=await r.json()}catch(e){}
  if(!r.ok){const e=new Error(data.error||'Нет связи с сервером. Проверьте интернет и попробуйте ещё раз.');e.status=r.status;throw e}
  return data;
}
const isAdminRoute=()=>location.hash==='#admin';
const isAccountRoute=()=>location.hash==='#account';
async function loadMe(){try{U=await api('/api/account/me')}catch(e){U=null}updAcc()}
function updAcc(){$('#accTxt').textContent=U?'Кабинет':'Войти';$('#accBtn').classList.toggle('on',!!U)}
const owner=()=>(A&&A.owner)||(C&&C.owner)||{};

/* ---------- общий рендер ---------- */
async function render(){
  const adm=isAdminRoute();
  $('#modes').hidden=!A;
  $('#m-shop').setAttribute('aria-pressed',!adm);$('#m-admin').setAttribute('aria-pressed',adm);
  const accR=isAccountRoute();
  $('#cartBtn').hidden=adm;$('#nav').hidden=adm||accR;$('#accBtn').hidden=adm;
  updCount();
  if(U===undefined)await loadMe();
  if(accR){
    await loadMe();
    if(!C){try{C=await api('/api/catalog')}catch(e){}}
    $('#app').innerHTML=accountView();scrollTo(0,0);
  }else if(adm){
    if(!A){try{A=await api('/api/admin/state')}catch(e){if(e.status!==401){$('#app').innerHTML=`<div class="wrap empty">${esc(e.message)}</div>`;return}}}
    $('#modes').hidden=!A;
    $('#app').innerHTML=A?adminView():loginView();
  }else{
    if(!C){try{C=await api('/api/catalog')}catch(e){$('#app').innerHTML=`<div class="wrap empty">${esc(e.message)}</div>`;return}}
    for(const id in cart)if(!C.products.find(p=>p.id==id))delete cart[id];
    $('#app').innerHTML=shopView();renderGrid();updCount();
    const t=location.hash&&document.getElementById(location.hash.slice(1));if(t)t.scrollIntoView();
  }
  renderFoot();
}
window.addEventListener('hashchange',()=>{
  closeLayer();
  if(!isAdminRoute()&&!isAccountRoute()&&$('#shop')){const t=document.getElementById(location.hash.slice(1));if(t)t.scrollIntoView();else if(!location.hash||location.hash==='#top')scrollTo(0,0);return}
  render();
});
function renderFoot(){
  const o=owner(),wa=digits(o.phone);
  const ph=$('#phoneTop');ph.hidden=!o.phone||isAdminRoute();if(o.phone){ph.textContent=o.phone;ph.href='tel:+'+wa}
  $('#contacts').innerHTML=`<div class="wrap foot-in">
   <div style="display:grid;gap:12px;align-content:start"><img src="/logo-light.png" alt="Mebel Segment" style="height:40px;width:auto;justify-self:start"><p class="small" style="margin:0">Мебельная фурнитура оптом и в розницу${o.addr?" · "+esc(o.addr).replace(/^г\. /,""):""}. Также продаём на Ozon.</p></div>
   <div><div class="lbl">Телефон</div>${o.phone?`<a class="big num" href="tel:+${wa}">${esc(o.phone)}</a>`:'<span class="small">Появится после заполнения в кабинете</span>'}
     ${o.phone?`<div><a class="small" href="https://wa.me/${wa}" target="_blank" rel="noopener">Написать в WhatsApp →</a></div>`:''}</div>
   <div><div class="lbl">Почта</div>${o.email?`<a class="big" href="mailto:${esc(o.email)}">${esc(o.email)}</a>`:'<span class="small">—</span>'}</div>
   <div><div class="lbl">Сайт</div><span class="big">mebel-segment.ru</span><div class="small">© ${new Date().getFullYear()} ${o.name?esc(o.name):'Mebel Segment'}</div></div>
  </div>`;
}
function updCount(){$('#cartCount').textContent=Object.values(cart).reduce((a,b)=>a+b,0)}

/* ---------- магазин ---------- */
const P=id=>(C?C.products:A.products).find(p=>p.id==id);
const picOf=p=>p.photo?`<img src="/uploads/${esc(p.photo)}" alt="${esc(p.name)}" loading="lazy">`:(ICONS[p.cat]||ICONS['Прочее']);
function stockBadge(p){
  if(p.stock<=0)return'<span class="stock s-out">Под заказ</span>';
  if(p.stock<LOW)return`<span class="stock s-low">Осталось ${p.stock} ${esc(p.unit)}</span>`;
  return`<span class="stock s-ok">В наличии</span>`;
}
function shopView(){
  const cats=C.cats.filter(c=>C.products.some(p=>p.cat===c));
  return`<div id="shop"><div class="wrap" id="top">
  <section class="hero">
   <div class="hero-main">
    <span class="tag">Mebel Segment · Ставрополь</span>
    <h1 class="caps"><span class="ln"><span>Мебельная</span></span><span class="ln"><span>фурнитура</span></span><span class="ln"><span>для производителей</span></span></h1>
    <p>Петли с доводчиком clip-on, 3D-петли, шариковые направляющие и направляющие скрытого монтажа для производителей мебели и магазинов.</p>
    <a class="btn light" href="#catalog">Открыть каталог</a>
    ${HERO_ART}
   </div>
   <div class="hero-side">
    <a class="side-card light" href="#opt"><h2 class="caps">Опт<br>коробками</h2><p>Заводская фасовка: петли по 200–250 шт., направляющие по 10–30 шт.</p><span class="go">Оптовикам →</span></a>
    <a class="side-card dark" href="#opt"><h2 class="caps">Заказ<br>по списку</h2><p>Пришлите список, соберём заказ из разных позиций и рассчитаем доставку.</p><span class="go">Как отправить →</span></a>
   </div>
  </section>
  <form class="search" id="searchForm" role="search"><input id="q" type="text" placeholder="Найти фурнитуру: петля, направляющие, артикул…" value="${esc(filt.q)}" aria-label="Поиск по каталогу"><button class="btn primary small" type="submit">Найти</button></form>
  </div>
  <div class="ticker" aria-hidden="true"><div class="ticker-in">${[0,1].map(()=>TICKER.map(t=>`<span>${t}</span>`).join('')).join('')}</div></div>

  <section class="section wrap" id="catalog">
   <div class="sec-head"><h2 class="caps">Каталог</h2>
    <div class="filters"><button class="chip" data-act="cat" data-v="" aria-pressed="${!filt.cat}">Все</button>
    ${cats.map(c=>`<button class="chip" data-act="cat" data-v="${esc(c)}" aria-pressed="${filt.cat===c}">${esc(c)}</button>`).join('')}</div></div>
   <div class="grid" id="grid"></div>
  </section>

  <section class="section wrap" id="how">
   <div class="sec-head"><h2 class="caps">Как работаем</h2></div>
   <div class="steps">
    <div class="step"><b>1</b><h3>Соберите корзину</h3><p>Выберите позиции и количество. Если товара нет на складе, его можно заказать под заказ.</p></div>
    <div class="step"><b>2</b><h3>Подтвердим и выставим счёт</h3><p>Менеджер перезвонит, проверит наличие и сроки, пришлёт счёт или ссылку на оплату.</p></div>
    <div class="step"><b>3</b><h3>Заберите или получите доставкой</h3><p>Самовывоз со склада или доставка по адресу — как удобнее.</p></div>
   </div>
  </section>

  <section class="section wrap" id="guide">
   <div class="sec-head"><h2 class="caps">Как выбрать<br>фурнитуру</h2></div>
   <div class="guide">
    <div><h3>Накладная петля</h3><p>Самый популярный вид. Дверца полностью закрывает торцы боковых стенок — снаружи виден только фасад. Отдельно стоящие шкафы, тумбы, кухонные модули.</p></div>
    <div><h3>Полунакладная петля</h3><p>Когда на одну общую перегородку крепятся две дверцы, открывающиеся в разные стороны. Дверца закрывает торец наполовину.</p></div>
    <div><h3>Вкладная петля</h3><p>Дверца утапливается внутрь корпуса, фасад в одной плоскости с каркасом. Дизайнерская мебель, эффект ниши.</p></div>
    <div><h3>3D-петля</h3><p>Регулировка по высоте, ширине и глубине. Позволяет выровнять фасады даже при погрешностях монтажа.</p></div>
    <div><h3>Система Clip-on</h3><p>Планка ставится на стойку, петля защёлкивается на ней. Чтобы снять дверцу, достаточно нажать на защёлку.</p></div>
    <div><h3>Мини-петли</h3><p>Чашка Ø26 мм вместо 35 мм — для лёгких малогабаритных фасадов толщиной до 18–20 мм.</p></div>
    <div><h3>Полное выдвижение</h3><p>Телескопические направляющие: ящик выдвигается на всю длину. 45/300 — высота 45 мм, длина 300 мм.</p></div>
    <div><h3>Скрытый монтаж</h3><p>Направляющие ставятся под дно ящика — механизм не виден при открытии.</p></div>
   </div>
  </section>

  <section class="section wrap" id="opt">
   <div class="opt">
    <div style="display:grid;gap:16px;align-content:start"><h2 class="caps">Оптовикам<br>и мастерским</h2>
     <p>Работаем с мебельными цехами, сборщиками и магазинами. Счёт с реквизитами, отгрузка коробками, заказ по вашему списку артикулов.</p>

async function checkout(f){
  const btn=f.querySelector('button[type=submit]');btn.disabled=true;

    const r=await api('/api/orders',{name:$('#c-name').value,phone:$('#c-phone').value,inn:$('#c-inn')?.value||'',comment:$('#c-comment').value,kind:ck.kind,delivery:ck.delivery,
      items:cartIds().map(id=>({pid:+id,qty:cart[id]}))});
    lastOrder=r;cart={};saveCart();C=null;A=null;if(U)U=undefined;await render();
    modal(`<div class="m-head"><h2 class="caps">Заказ принят</h2><button class="x" data-act="close" aria-label="Закрыть">×</button></div>
     <div class="done"><b>Заказ №${r.order} на ${rub(r.sum)}</b><span>Менеджер перезвонит, подтвердит наличие и пришлёт счёт №${r.invoice}.</span>${U?'<span>Заказ уже виден в <a href="#account" data-act="close">личном кабинете</a>.</span>':''}</div>

}

async function toJpeg(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,bad)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>bad(new Error('Не удалось открыть картинку. Попробуйте JPG или PNG.'));i.src=url});
    const k=Math.min(1,1200/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',0.85);
  }finally{URL.revokeObjectURL(url)}
}

document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='searchForm'){document.getElementById('catalog').scrollIntoView();return}
  if(f.id==='checkout')return checkout(f);
  if(f.id==='uLogin'||f.id==='uReg'){
    const reg=f.id==='uReg',err=reg?'r-err':'u-err',btn=f.querySelector('button[type=submit]');btn.disabled=true;
    try{
      if(reg)await api('/api/account/register',{name:$('#r-name').value,email:$('#r-email').value,phone:$('#r-phone').value,company:$('#r-company').value,inn:$('#r-inn').value,password:$('#r-pass').value});
      else await api('/api/account/login',{email:$('#u-email').value,password:$('#u-pass').value});
      accTab='login';await loadMe();$('#app').innerHTML=accountView();toast(reg?'Добро пожаловать! Кабинет создан':'Вы вошли');
    }catch(e){showErr(err,e.message);btn.disabled=false}
    return;
  }
  if(f.id==='uProfile'){try{await api('/api/account/profile',{name:$('#p2-name').value,phone:$('#p2-phone').value,company:$('#p2-company').value,inn:$('#p2-inn').value});await loadMe();$('#app').innerHTML=accountView();toast('Данные сохранены')}catch(e){showErr('p2-err',e.message)}return}
  if(f.id==='uPass'){try{await api('/api/account/password',{old:$('#pw-old').value,password:$('#pw-new').value});f.reset();toast('Пароль изменён')}catch(e){showErr('pw-err',e.message)}return}
  if(f.id==='gate'){
    try{await api('/api/login',{password:$('#pin').value});A=null;render()}
    catch(err){showErr('pin-err',err.message)}
    return;
  }
  const run=async(errId,url,body,msg)=>{try{await api(url,body);await reload(msg)}catch(err){if(err.status===401){A=null;render()}else if(errId)showErr(errId,err.message);else toast(err.message)}};
  if(f.id==='invForm')run('i-err','/api/admin/invoices',{client:$('#i-client').value,inn:$('#i-inn').value,items:readLines('i-lines',false)},'Счёт выставлен');
  else if(f.id==='pForm')run('p-err','/api/admin/products',{id:$('#p-id').value||undefined,sku:$('#p-sku').value,name:$('#p-name').value,cat:$('#p-cat').value,unit:$('#p-unit').value,price:$('#p-price').value,box:$('#p-box').value,descr:$('#p-descr').value},'Товар сохранён');
  else if(f.id==='rForm')run('r-err','/api/admin/receipts',{supplier:$('#r-sup').value,bank:$('#r-bank').value,items:readLines('r-lines',true)},'Приход проведён, остатки увеличены');
  else if(f.id==='tForm')run('t-err','/api/admin/txns',{bank:$('#t-bank').value,text:$('#t-text').value,amount:$('#t-amount').value},'Операция добавлена');
  else if(f.id==='oForm'){const b={};for(const k of Object.keys(A.owner))b[k]=$('#o-'+k)?.value??'';C=null;run(null,'/api/admin/owner',b,'Сохранено')}
  else if(f.dataset.bank!==undefined)run(null,'/api/admin/banks',{id:f.dataset.bank||undefined,name:f.querySelector('.b-name').value,acc:f.querySelector('.b-acc').value,balance:f.dataset.bank?f.querySelector('.b-bal').value:undefined},'Банк сохранён');
});
/* приветственная заставка: один раз за посещение, не в кабинете */
(function(){
  const el=document.getElementById('intro');
  let seen=false;try{seen=sessionStorage.getItem('introSeen')==='1'}catch(e){}
  if(seen||isAdminRoute()||matchMedia('(prefers-reduced-motion: reduce)').matches){el.remove();return}
  el.hidden=false;document.documentElement.style.overflow='hidden';document.body.classList.add('intro-on');
  let closed=false;
  const close=()=>{if(closed)return;closed=true;try{sessionStorage.setItem('introSeen','1')}catch(e){}
    const mark=document.getElementById('introMark'),logo=document.getElementById('logo');
    const target=(logo&&!logo.hidden)?logo:document.querySelector('.brand');
    const a=mark.getBoundingClientRect(),b=target.getBoundingClientRect();
    const k=b.height/a.height;
    el.classList.add('out');document.body.classList.add('reveal');document.documentElement.style.overflow='';
    mark.style.transform=`translate(${b.left-a.left}px,${b.top-a.top}px) scale(${k})`;
    setTimeout(()=>{document.body.classList.remove('intro-on');el.remove()},1900)};
  el.addEventListener('click',close);
  addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Enter'||e.key===' ')close()},{once:true});
  setTimeout(close,3600);
})();
render();
</script>
</body>
</html>
